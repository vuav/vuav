name: cipher-gate

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  judge:
    # only wake up for gate submissions
    if: startsWith(github.event.issue.title, 'solve:') || startsWith(github.event.issue.title, 'Solve:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: judge submission
        run: python scripts/cipher_game.py
        env:
          GH_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          REPO:         ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE:  ${{ github.event.issue.title }}
          ISSUE_USER:   ${{ github.event.issue.user.login }}

      - name: record solver if the README changed
        run: |
          git config user.name  "vuav-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "feat(gate): new solver etched into the hall of fame"
          git push || true
