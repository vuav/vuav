name: threat-feed

on:
  schedule:
    - cron: "0 6 * * *"    # every day at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: refresh threat feed
        run: python scripts/cve_feed.py

      - name: commit if changed
        run: |
          git config user.name  "vuav-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore(feed): refresh actively-exploited vulns"
          git push
