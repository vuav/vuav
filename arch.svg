<svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="USBVAULT key hierarchy">
  <title>usbvault key hierarchy</title>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0 0 L6.5 3 L0 6 Z" fill="#45454f"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0 0 L6.5 3 L0 6 Z" fill="#8c1f28"/>
    </marker>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style><![CDATA[
      text{font-family:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace}
      .l{fill:#cfcfd6} .s{fill:#6a6a76} .h{fill:#8c8c96}
      .pulse{offset-path:none}
      @keyframes fade{0%,100%{opacity:0}12%,88%{opacity:1}}
      #dot{animation:fade 3.6s ease-in-out infinite}
      @media (prefers-reduced-motion: reduce){#dot,#mo{animation:none;display:none}}
    ]]></style>
  </defs>

  <rect x="1.5" y="1.5" width="997" height="437" rx="10" fill="#0a0a0c" stroke="#1b1b21"/>
  <text x="24" y="32" font-size="14" letter-spacing="1" class="l">usbvault</text>
  <text x="94" y="32" font-size="14" letter-spacing="1" class="s">· key hierarchy</text>
  <text x="976" y="32" font-size="11" text-anchor="end" class="s">oxblood = live unlock path</text>

  <!-- unlock methods -->
  <g font-size="14">
    <rect x="40"  y="70"  width="210" height="54" rx="6" fill="#101014" stroke="#8c1f28"/>
    <text x="54" y="98"  class="l">password</text><text x="54" y="115" font-size="11" class="s">argon2id · m=1GiB t=3 p=4</text>

    <rect x="40"  y="142" width="210" height="54" rx="6" fill="#101014" stroke="#26262e"/>
    <text x="54" y="170" class="l">fido2</text><text x="54" y="187" font-size="11" class="s">hmac-secret extension</text>

    <rect x="40"  y="214" width="210" height="54" rx="6" fill="#101014" stroke="#26262e"/>
    <text x="54" y="242" class="l">tpm 2.0</text><text x="54" y="259" font-size="11" class="s">sealed to pcrs</text>

    <rect x="40"  y="286" width="210" height="54" rx="6" fill="#101014" stroke="#26262e"/>
    <text x="54" y="314" class="l">recovery</text><text x="54" y="331" font-size="11" class="s">shamir · k-of-n shares</text>
  </g>

  <!-- arrows: methods -> slots -->
  <path d="M250 97  L392 144" fill="none" stroke="#8c1f28" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M250 169 L392 206" fill="none" stroke="#31313a" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M250 241 L392 268" fill="none" stroke="#31313a" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M250 313 L392 330" fill="none" stroke="#31313a" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- header + slots -->
  <rect x="396" y="70" width="176" height="290" rx="8" fill="#0c0c10" stroke="#3a1a1e"/>
  <text x="412" y="96" font-size="13" class="h">volume header</text>
  <g font-size="12.5">
    <rect x="412" y="118" width="146" height="48" rx="5" fill="#121216" stroke="#2a2a32"/>
    <text x="424" y="138" class="l">slot 0</text><text x="424" y="155" font-size="10.5" class="s">wrap(kek0, dek)</text>
    <rect x="412" y="176" width="146" height="48" rx="5" fill="#121216" stroke="#2a2a32"/>
    <text x="424" y="196" class="l">slot 1</text><text x="424" y="213" font-size="10.5" class="s">wrap(kek1, dek)</text>
    <rect x="412" y="234" width="146" height="48" rx="5" fill="#121216" stroke="#2a2a32"/>
    <text x="424" y="254" class="l">slot 2</text><text x="424" y="271" font-size="10.5" class="s">wrap(kek2, dek)</text>
    <rect x="412" y="292" width="146" height="48" rx="5" fill="#121216" stroke="#2a2a32"/>
    <text x="424" y="312" class="l">slot 3</text><text x="424" y="329" font-size="10.5" class="s">wrap(kek3, dek)</text>
  </g>

  <!-- arrows: slots -> dek -->
  <path d="M558 142 L636 206" fill="none" stroke="#8c1f28" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M558 200 L636 214" fill="none" stroke="#31313a" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M558 258 L636 224" fill="none" stroke="#31313a" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M558 316 L636 232" fill="none" stroke="#31313a" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- DEK -->
  <rect x="640" y="180" width="150" height="80" rx="8" fill="#101014" stroke="#26262e"/>
  <text x="715" y="212" font-size="20" text-anchor="middle" class="l">DEK</text>
  <text x="715" y="232" font-size="10.5" text-anchor="middle" class="s">256-bit · random at format</text>
  <text x="715" y="248" font-size="10.5" text-anchor="middle" class="s">unwrapped in memory only</text>

  <!-- DEK -> cipher -->
  <path d="M790 220 L816 220" fill="none" stroke="#8c1f28" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- cipher -->
  <rect x="820" y="185" width="160" height="72" rx="8" fill="#101014" stroke="#26262e"/>
  <text x="900" y="212" font-size="12.5" text-anchor="middle" class="l">xchacha20-poly1305</text>
  <text x="900" y="230" font-size="10.5" text-anchor="middle" class="s">per-file · per-chunk aead</text>
  <text x="900" y="246" font-size="10.5" text-anchor="middle" class="s">→ chunk[0..n]</text>

  <!-- integrity strip -->
  <line x1="40" y1="386" x2="980" y2="386" stroke="#1b1b21"/>
  <text x="40" y="410" font-size="11" class="s">integrity</text>
  <text x="112" y="410" font-size="11" class="h">merkle tree over per-chunk tags</text>
  <text x="360" y="410" font-size="11" class="s">·</text>
  <text x="376" y="410" font-size="11" class="h">anti-rollback header counter</text>
  <text x="600" y="410" font-size="11" class="s">·</text>
  <text x="616" y="410" font-size="11" class="h">crypto-shred: wipe header, data dies</text>

  <!-- animated unlock pulse -->
  <circle id="dot" r="4" fill="#c62c38" filter="url(#g)">
    <animateMotion id="mo" dur="3.6s" repeatCount="indefinite" rotate="0"
      path="M250 97 L392 144 L558 142 L636 206 L715 220 L816 220"/>
  </circle>
</svg>
