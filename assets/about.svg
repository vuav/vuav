<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 584" width="900" height="584" role="img" aria-label="About. It started with a 3DS: at nine I wanted games I couldn't afford, so I got curious about how the device worked. That curiosity became Linux, reverse engineering, security research, AI and a lot of side projects. I am 17, based in London, finishing a Computing Level 3 BTEC and aiming at PJATK in Warsaw. Devices taken apart, modified or researched: Nintendo 3DS, Switch OLED, PS3, iOS. I don't just use technology, I want to know why it does what it does."><title>About. It started with a 3DS: at nine I wanted games I couldn't afford, so I got curious about how the device worked. That curiosity became Linux, reverse engineering, security research, AI and a lot of side projects. I am 17, based in London, finishing a Computing Level 3 BTEC and aiming at PJATK in Warsaw. Devices taken apart, modified or researched: Nintendo 3DS, Switch OLED, PS3, iOS. I don't just use technology, I want to know why it does what it does.</title><rect x="0" y="0" width="900" height="584" rx="0" fill="#0A0B0D"/><text x="44" y="40" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="500" fill="#7FA0B8" text-anchor="start" letter-spacing="3.2">01 — ORIGIN</text><text x="44" y="80" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="31" font-weight="700" fill="#E9EBED" text-anchor="start" letter-spacing="-0.4">It started with a 3DS.</text><text x="856" y="80" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="500" fill="#565D66" text-anchor="end" letter-spacing="2.4">AGE 9 → 17</text><line x1="44" y1="100" x2="856" y2="100" stroke="#23272E" stroke-width="1" stroke-linecap="butt"/><line x1="44" y1="100" x2="100" y2="100" stroke="#7FA0B8" stroke-width="1.6" stroke-linecap="butt"/><text x="44" y="158" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#8A929B" text-anchor="start">I was nine, I wanted games I couldn't afford, and</text><text x="44" y="184.73" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#8A929B" text-anchor="start">instead of accepting that I got curious about how the</text><text x="44" y="211.45999999999998" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#8A929B" text-anchor="start">thing actually worked. I read, broke it, and put it</text><text x="44" y="238.18999999999997" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#8A929B" text-anchor="start">back together.</text><text x="44" y="272" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#8A929B" text-anchor="start">That curiosity outlived the console. Eight years later</text><text x="44" y="298.73" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#8A929B" text-anchor="start">it's Linux, reverse engineering, security research, AI</text><text x="44" y="325.46000000000004" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#8A929B" text-anchor="start">and a questionable number of side projects.</text><text x="44" y="360" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#8A929B" text-anchor="start">I'm 17, based in London, finishing a Level 3 BTEC in</text><text x="44" y="386.73" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#8A929B" text-anchor="start">Computing and aiming at PJATK in Warsaw.</text><text x="44" y="434" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#565D66" text-anchor="start" letter-spacing="2.4">TAKEN APART / MODIFIED / RESEARCHED</text><rect x="44" y="448" width="113.0" height="23" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><text x="54" y="463.5" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">NINTENDO 3DS</text><rect x="164.0" y="448" width="105.3" height="23" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><text x="174.0" y="463.5" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">SWITCH OLED</text><rect x="276.3" y="448" width="43.3" height="23" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><text x="286.3" y="463.5" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">PS3</text><rect x="326.6" y="448" width="43.3" height="23" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><text x="336.6" y="463.5" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">IOS</text><rect x="552" y="132" width="304" height="340" rx="4" fill="#101216" stroke="#23272E" stroke-width="1"/><line x1="553" y1="133" x2="553" y2="471" stroke="#13171C" stroke-width="0.6" stroke-linecap="butt" opacity="0.6"/><line x1="577" y1="133" x2="577" y2="471" stroke="#13171C" stroke-width="0.6" stroke-linecap="butt" opacity="0.6"/><line x1="601" y1="133" x2="601" y2="471" stroke="#13171C" stroke-width="0.6" stroke-linecap="butt" opacity="0.6"/><line x1="625" y1="133" x2="625" y2="471" stroke="#13171C" stroke-width="0.6" stroke-linecap="butt" opacity="0.6"/><line x1="649" y1="133" x2=