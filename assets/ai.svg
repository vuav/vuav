<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="AI and LLM work. Focus: prompt and context engineering, agentic systems and structured outputs, local model experimentation, prompt injection research, jailbreak and LLM security research. Worked with Python, PyTorch, Ollama, OpenRouter, Claude, ChatGPT/OpenAI, Gemini, Qwen, DeepSeek and Cursor. Note: building a local LLM here means running and experimenting with local models and tooling, not training a frontier model."><title>AI and LLM work. Focus: prompt and context engineering, agentic systems and structured outputs, local model experimentation, prompt injection research, jailbreak and LLM security research. Worked with Python, PyTorch, Ollama, OpenRouter, Claude, ChatGPT/OpenAI, Gemini, Qwen, DeepSeek and Cursor. Note: building a local LLM here means running and experimenting with local models and tooling, not training a frontier model.</title><rect x="0" y="0" width="900" height="500" rx="0" fill="#0A0B0D"/><text x="44" y="36" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="500" fill="#7FA0B8" text-anchor="start" letter-spacing="3.2">04 — AI / LLM</text><text x="44" y="76" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="31" font-weight="700" fill="#E9EBED" text-anchor="start" letter-spacing="-0.4">Getting models to behave</text><text x="856" y="76" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="500" fill="#565D66" text-anchor="end" letter-spacing="2.4">and to misbehave</text><line x1="44" y1="96" x2="856" y2="96" stroke="#23272E" stroke-width="1" stroke-linecap="butt"/><line x1="44" y1="96" x2="100" y2="96" stroke="#7FA0B8" stroke-width="1.6" stroke-linecap="butt"/><text x="44" y="138" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#8A929B" text-anchor="start">Most of my AI time goes into the parts people skip:</text><text x="44" y="164.73" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#8A929B" text-anchor="start">context, structure, and what a model does when it's</text><text x="44" y="191.45999999999998" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#8A929B" text-anchor="start">deliberately pushed off script. I run models locally</text><text x="44" y="218.18999999999997" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#8A929B" text-anchor="start">and read the failures.</text><text x="44" y="250" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#8A929B" text-anchor="start">The security half is the same instinct as everything</text><text x="44" y="276.73" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#8A929B" text-anchor="start">else here — if I can make it break, I understand it</text><text x="44" y="303.46000000000004" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#8A929B" text-anchor="start">better.</text><rect x="552" y="130" width="304" height="208" rx="4" fill="#101216" stroke="#23272E" stroke-width="1"/><text x="568" y="154" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#7FA0B8" text-anchor="start" letter-spacing="2.6">FOCUS</text><line x1="568" y1="168" x2="840" y2="168" stroke="#23272E" stroke-width="1" stroke-linecap="butt" opacity="0.8"/><text x="568" y="186" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#7FA0B8" text-anchor="start">·</text><text x="582" y="186" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">Prompt &amp; context engineering</text><line x1="568" y1="200" x2="840" y2="200" stroke="#23272E" stroke-width="1" stroke-linecap="butt" opacity="0.8"/><text x="568" y="218" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#7FA0B8" text-anchor="start">·</text><text x="582" y="218" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">Agentic systems, structured outputs</text><line x1="568" y1="232" x2="840" y2="232" stroke="#23272E" stroke-width="1" stroke-linecap="butt" opacity="0.8"/><text x="568" y="250" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#7FA0B8" text-anchor="start">·</text><text x="582" y="250" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">Local model experimentation</text><line x1="568" y1="264" x2="840" y2="264" stroke="#23272E" stroke-width="1" stroke-linecap="butt" opacity="0.8"/><text x="568" y="282" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#7FA0B8" text-anchor="start">·</text><text x="582" y="282" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">Prompt injection research</text><line x1="568" y1="296" x2="840" y2="296" stroke="#23272E" stroke-width="1" stroke-linecap="butt" opacity="0.8"/><text x="568" y="314" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" fill="#7FA0B8" text-anchor="start">·</text><text x="582" y="314" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">Jailbreak &amp; LLM security research</text><text x="44" y="340" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#565D66" text-anchor="start" letter-spacing="2.6">WORKED WITH</text><rect x="44" y="352" width="66.5" height="24" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><text x="54" y="368.0" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">PYTHON</text><rect x="117.5" y="352" width="74.3" height="24" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><text x="127.5" y="368.0" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">PYTORCH</text><rect x="198.8" y="352" width="66.5" height="24" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><text x="208.8" y="368.0" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">OLLAMA</text><rect x="272.3" y="352" width="97.5" height="24" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><text x="282.3" y="368.0" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">OPENROUTER</text><rect x="376.8" y="352" width="66.5" height="24" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><text x="386.8" y="368.0" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" 