<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 324" width="900" height="324" role="img" aria-label="Beyond code: I run my own clothing brand. I built the site and handle branding, operations, development and growth myself. It has been running for about a year and a half and expanded into Poland. The site is private for now."><title>Beyond code: I run my own clothing brand. I built the site and handle branding, operations, development and growth myself. It has been running for about a year and a half and expanded into Poland. The site is private for now.</title><rect x="0" y="0" width="900" height="324" rx="0" fill="#0A0B0D"/><text x="44" y="36" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="500" fill="#7FA0B8" text-anchor="start" letter-spacing="3.2">10 — BEYOND CODE</text><text x="44" y="76" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="31" font-weight="700" fill="#E9EBED" text-anchor="start" letter-spacing="-0.4">I also sell clothes</text><text x="856" y="76" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="500" fill="#565D66" text-anchor="end" letter-spacing="2.4">≈1.5 years</text><line x1="44" y1="96" x2="856" y2="96" stroke="#23272E" stroke-width="1" stroke-linecap="butt"/><line x1="44" y1="96" x2="100" y2="96" stroke="#7FA0B8" stroke-width="1.6" stroke-linecap="butt"/><text x="44" y="138" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#8A929B" text-anchor="start">When I'm not building software I run my own clothing</text><text x="44" y="164.73" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#8A929B" text-anchor="start">brand. I built the site, and I handle the branding,</text><text x="44" y="191.45999999999998" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#8A929B" text-anchor="start">operations, development and growth myself — which mostly</text><text x="44" y="218.18999999999997" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#8A929B" text-anchor="start">means learning what happens after you press deploy.</text><text x="44" y="254" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#8A929B" text-anchor="start">It has been running for about a year and a half. The</text><text x="44" y="280.73" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16.5" font-weight="400" fill="#8A929B" text-anchor="start">milestone I'm proudest of is expanding into Poland.</text><rect x="596" y="128" width="260" height="148" rx="4" fill="#101216" stroke="#23272E" stroke-width="1"/><line x1="596" y1="128" x2="605" y2="128" stroke="#3C4E5C" stroke-width="1.2" stroke-linecap="butt"/><line x1="596" y1="128" x2="596" y2="137" stroke="#3C4E5C" stroke-width="1.2" stroke-linecap="butt"/><line x1="856" y1="128" x2="847" y2="128" stroke="#3C4E5C" stroke-width="1.2" stroke-linecap="butt"/><line x1="856" y1="128" x2="856" y2="137" stroke="#3C4E5C" stroke-width="1.2" stroke-linecap="butt"/><line x1="596" y1="276" x2="605" y2="276" stroke="#3C4E5C" stroke-width="1.2" stroke-linecap="butt"/><line x1="596" y1="276" x2="596" y2="267" stroke="#3C4E5C" stroke-width="1.2" stroke-linecap="butt"/><line x1="856" y1="276" x2="847" y2="276" stroke="#3C4E5C" stroke-width="1.2" stroke-linecap="butt"/><line x1="856" y1="276" x2="856" y2="267" stroke="#3C4E5C" stroke-width="1.2" stroke-linecap="butt"/><text x="614" y="162" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#565D66" text-anchor="start" letter-spacing="1.6">running</text><text x="704" y="162" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="500" fill="#8A929B" text-anchor="start">~1.5 years</text><line x1="614" y1="174" x2="838" y2="174" stroke="#23272E" stroke-width="1" stroke-linecap="butt" opacity="0.7"/><text x="614" y="192" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#565D66" text-anchor="start" letter-spacing="1.6">role</text><text x="704" y="192" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="500" fill="#8A929B" text-anchor="start">all of them</text><line x1="614" y1="204" x2="838" y2="204" stroke="#23272E" stroke-width="1" stroke-linecap="butt" opacity="0.7"/><text x="614" y="222" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#565D66" text-anchor="start" letter-spacing="1.6">market</text><text x="704" y="222" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="500" fill="#8A929B" text-anchor="start">UK → Poland</text><line x1="614" y1="234" x2="838" y2="234" stroke="#23272E" stroke-width="1" stroke-linecap="butt" opacity="0.7"/><text x="614" y="252" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#565D66" text-anchor="start" letter-spacing="1.6">site</text><text x="704" y="252" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="500" fill="#8A929B" text-anchor="start">private for now</text></svg>