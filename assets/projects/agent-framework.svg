<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 323" width="900" height="323" role="img" aria-label="Agent Framework — The scaffolding, not another wrapper. A framework for building tool-using LLM agents: conversation memory, a tool registry, and a loop that decides when to call a tool, runs it, and feeds the result back to the model — with loop guards so it can&#x27;t spin forever. Adding a new tool is a small, defined step, not a rewrite. The infrastructure around agents, rather than another wrapper around a chat endpoint.">
