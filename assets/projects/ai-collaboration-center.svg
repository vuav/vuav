<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 344" width="900" height="344" role="img" aria-label="AI Collaboration Center — Two coding agents, one referee. A desktop app that runs structured debates between two coding agents — Codex CLI and Claude Code. A controller decides who speaks, a turn protocol keeps them in order, and shared context is passed between them each round. The hard part wasn&#x27;t the AI, it was the plumbing: I fixed a Codex stdin deadlock on Windows and a handful of IPC and concurrency bugs to get two processes cooperating without hanging.">
