<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 296" width="900" height="296" role="img" aria-label="Hardware bench. ClapSync, an experiment: an alarm clock that detects a specific clap rhythm and triggers Spotify playback, built with a Raspberry Pi, audio input and the Spotify API. RC Car: a remote-control car built from parts with sensors, using Arduino, sensors and motor control, designed and assembled rather than followed from a tutorial."><title>Hardware bench. ClapSync, an experiment: an alarm clock that detects a specific clap rhythm and triggers Spotify playback, built with a Raspberry Pi, audio input and the Spotify API. RC Car: a remote-control car built from parts with sensors, using Arduino, sensors and motor control, designed and assembled rather than followed from a tutorial.</title><rect x="0" y="0" width="900" height="296" rx="0" fill="#0A0B0D"/><rect x="44" y="24" width="812" height="248" rx="4" fill="#101216" stroke="#23272E" stroke-width="1"/><line x1="44" y1="24" x2="100" y2="24" stroke="#7FA0B8" stroke-width="2" stroke-linecap="butt"/><text x="70" y="66" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#E9EBED" text-anchor="start" letter-spacing="-0.2">Hardware bench</text><text x="830" y="54" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#565D66" text-anchor="end" letter-spacing="2.2">05 / 05</text><line x1="70" y1="84" x2="830" y2="84" stroke="#23272E" stroke-width="1" stroke-linecap="butt"/><text x="70" y="120" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#E9EBED" text-anchor="start">ClapSync</text><rect x="158.08960000000002" y="104" width="109.5" height="21" rx="3" fill="none" stroke="#2E343C" stroke-width="1"/><circle cx="170.08960000000002" cy="114.5" r="2.6" fill="#8A929B"/><text x="180.08960000000002" y="118.5" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">EXPERIMENT</text><text x="70" y="144" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#7FA0B8" text-anchor="start" letter-spacing="1">Raspberry Pi · audio input · Spotify API</text><text x="70" y="172" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#565D66" text-anchor="start">Alarm clock that listens for a</text><text x="70" y="191.75" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#565D66" text-anchor="start">specific clap rhythm and starts</text><text x="70" y="211.5" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#565D66" text-anchor="start">Spotify. Input detection, API</text><text x="70" y="231.25" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#565D66" text-anchor="start">integration, and a genuinely</text><text x="70" y="251.0" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#565D66" text-anchor="start">terrible way to wake up.</text><line x1="310" y1="170.0" x2="310" y2="174.0" stroke="#2E343C" stroke-width="2" stroke-linecap="round"/><line x1="319" y1="167.5" x2="319" y2="176.5" stroke="#2E343C" stroke-width="2" stroke-linecap="round"/><line x1="328" y1="157.0" x2="328" y2="187.0" stroke="#7FA0B8" stroke-width="2" stroke-linecap="round"/><line x1="337" y1="165.0" x2="337" y2="179.0" stroke="#2E343C" stroke-width="2" stroke-linecap="round"/><line x1="346" y1="169.5" x2="346" y2="174.5" stroke="#2E343C" stroke-width="2" stroke-linecap="round"/><line x1="355" y1="170.5" x2="355" y2="173.5" stroke="#2E343C" stroke-width="2" stroke-linecap="round"