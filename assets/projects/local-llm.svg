<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 234" width="900" height="234" role="img" aria-label="Project: Local LLM, experimental. A local language-model project using Python, PyTorch, Ollama and OpenRouter, exploring model behaviour, inference and tooling. Model experimentation rather than model training."><title>Project: Local LLM, experimental. A local language-model project using Python, PyTorch, Ollama and OpenRouter, exploring model behaviour, inference and tooling. Model experimentation rather than model training.</title><rect x="0" y="0" width="900" height="234" rx="0" fill="#0A0B0D"/><rect x="44" y="24" width="812" height="186" rx="4" fill="#101216" stroke="#23272E" stroke-width="1"/><line x1="44" y1="24" x2="100" y2="24" stroke="#7FA0B8" stroke-width="2" stroke-linecap="butt"/><text x="70" y="68" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#E9EBED" text-anchor="start" letter-spacing="-0.2">Local LLM</text><rect x="214.94144" y="50" width="125.0" height="21" rx="3" fill="none" stroke="#2E343C" stroke-width="1"/><circle cx="226.94144" cy="60.5" r="2.6" fill="#8A929B"/><text x="236.94144" y="64.5" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">EXPERIMENTAL</text><text x="830" y="56" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#565D66" text-anchor="end" letter-spacing="2.2">03 / 05</text><text x="70" y="98" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#8A929B" text-anchor="start">A local language-model playground.</text><text x="70" y="124" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11" font-weight="500" fill="#7FA0B8" text-anchor="start" letter-spacing="1.1">Python · PyTorch · Ollama · OpenRouter</text><text x="70" y="152" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#565D66" text-anchor="start">Running models locally, wiring them into tooling and watching how behaviour changes</text><text x="70" y="172.8" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#565D66" text-anchor="start">when you change the context around them. Model experimentation rather than model</text><text x="70" y="193.60000000000002" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#565D66" text-anchor="start">training: inference, prompting, structure and the plumbing in between.</text><line x1="666" y1="44" x2="666" y2="190" stroke="#23272E" stroke-width="1" stroke-linecap="butt" opacity="0.7"/><rect x="692" y="89.0" width="96" height="34" rx="3" fill="#15181D" stroke="#2E343C" stroke-width="1" opacity="0.5"/><rect x="706" y="101.0" width="96" height="34" rx="3" fill="#15181D" stroke="#2E343C" stroke-width="1" opacity="0.75"/><rect x="720" y="113.0" width="96" height="34" rx="3" fill="#15181D" stroke="#2E343C" stroke-width="1" opacity="1.0"/><circle cx="730" cy="130.0" r="2.2" fill="#7FA0B8" opacity="0.4"/><circle cx="746" cy="130.0" r="2.2" fill="#7FA0B8" opacity="0.6000000000000001"/><circle cx="762" cy="130.0" r="2.2" fill="#7FA0B8" opacity="0.8"/><circle cx="778" cy="130.0" r="2.2" fill="#7FA0B8" opacity="1.0"/></svg>