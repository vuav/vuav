<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 254" width="900" height="254" role="img" aria-label="Project: Proxy Hunter, active, Python. A multithreaded CLI proxy scraper, checker and scorer with optional Telegram integration. It gathers publicly listed proxies from several sources, validates them, discards non-working ones, avoids rechecking the same proxy, and rates survivors from 0 to 10. Built as a networking and reliability-testing exercise."><title>Project: Proxy Hunter, active, Python. A multithreaded CLI proxy scraper, checker and scorer with optional Telegram integration. It gathers publicly listed proxies from several sources, validates them, discards non-working ones, avoids rechecking the same proxy, and rates survivors from 0 to 10. Built as a networking and reliability-testing exercise.</title><rect x="0" y="0" width="900" height="254" rx="0" fill="#0A0B0D"/><rect x="44" y="24" width="812" height="206" rx="4" fill="#101216" stroke="#23272E" stroke-width="1"/><line x1="44" y1="24" x2="100" y2="24" stroke="#7FA0B8" stroke-width="2" stroke-linecap="butt"/><text x="70" y="68" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#E9EBED" text-anchor="start" letter-spacing="-0.2">Proxy Hunter</text><rect x="255.92192" y="50" width="78.5" height="21" rx="3" fill="none" stroke="#2E343C" stroke-width="1"/><circle cx="267.92192" cy="60.5" r="2.6" fill="#7FB894"/><text x="277.92192" y="64.5" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#7FB894" text-anchor="start" letter-spacing="1.4">ACTIVE</text><text x="830" y="56" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#565D66" text-anchor="end" letter-spacing="2.2">02 / 05</text><text x="70" y="98" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#8A929B" text-anchor="start">Multithreaded proxy scraper, checker and scorer.</text><text x="70" y="124" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11" font-weight="500" fill="#7FA0B8" text-anchor="start" letter-spacing="1.1">Python · threading · CLI · Telegram integration</text><text x="70" y="152" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#565D66" text-anchor="start">Pulls publicly listed proxies from multiple sources, validates them, drops the dead</text><text x="70" y="172.8" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#565D66" text-anchor="start">ones, skips anything it has already seen and scores the survivors 0–10. Built as a</text><text x="70" y="193.60000000000002" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#565D66" text-anchor="start">networking and reliability exercise — the interesting part is how fast a free proxy</text><text x="70" y="214.40000000000003" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#565D66" text-anchor="start">list rots.</text><line x1="666" y1="44" x2="666" y2="210" stroke="#23272E" stroke-width="1" stroke-linecap="butt" opacity="0.7"/><circle cx="696" cy="127.0" r="4" fill="none" stroke="#7FA0B8" stroke-width="1.2"/><line x1="696" y1="127.0" x2="734.946372846227" y2="130.18450422130854" stroke="#3C4E5C" stroke-width="0.8" stroke-linecap="butt" opacity="0.9"/><circle cx="734.946372846227" cy="130.18450422130854" r="2.4" fill="#7FA0B8"/><line x1="696" y1="127.0" x2="741.0179376612116" y2="134.482242778926" stroke="#2E343C" stroke-width="0.8" stroke-linecap="butt" opacity="0.5"/><circle cx="741.0179376612116" cy="134.482242778926" r="2.4" fill="none" stroke="#2E343C" stroke-width="1"/><line x1="696" y1="127.0" x2="752.7831339889705" y2="95.71807786526654" stroke="#2E343C" stroke-width="0.8" stroke-linecap="butt" opacity="0.5"/><circle cx="752.7831339889705" cy="95.71807786526654" r="2.4" fill="none" stroke="#2E343C" stroke-width="1"/><line x1="696" y1="127.0" x2="724.6057276115242" y2="151.29777391094512" stroke="#3C4E5C" stroke-width="0.8" stroke-linecap="butt" opacity="0.9"/><circle cx="724.6057276115242" cy="151.29777391094512" r="2.4" fill="#7FA0B8"/><line x1="696" y1="127.0" x2="735.9302846590883" y2="107.87182919536214" stroke="#2E343C" stroke-width="0.8" stroke-linecap="butt" opacity="0.5"/><circle cx="735.9302846590883" cy="107.87182919536214" r="2.4" fill="none" stroke="#2E343C" stroke-width="1"/><line x1="696" y1="127.0" x2="769.7996624334813" y2="124.85897254161625" stroke="#2E343C" stroke-width="0.8" stroke-linecap="butt" opacity="0.5"/><circle cx="769.7996624334813" cy="124.85897254161625" r="2.4" fill="none" stroke="#2E343C" stroke-width="1"/><line x1="696" y1="127.0" x2="762.4772267586219" y2="125.29743102635211" stroke="#3C4E5C" stroke-width="0.8" stroke-linecap="butt" opacity="0.9"/><circle cx="762.4772267586219" cy="125.29743102635211" r="2.4" fill="#7FA0B8"/><line x1="696" y1="127.0" x2="753.3971344650314" y2="101.84438252969372" stroke="#2E343C" stroke-width="0.8" stroke-linecap="butt" opacity="0.5"/><circle cx="753.3971344650314" cy="101.84438252969372" r="2.4" fill="none" stroke="#2E343C" stroke-width="1"/><line x1="696" y1="127.0" x2="753.2035902811186" y2="153.49926211431736" stroke="#2E343C" stroke-width="0.8" stroke-linecap="butt" opacity="0.5"/><circle cx="753.2035902811186" cy="153.49926211431736" r="2.4" fill="none" stroke="#2E343C" stroke-width="1"/><line x1="780" y1="127.0" x2="800" y2="127.0" stroke="#2E343C" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 3"/><circle cx="808" cy="127.0" r="4" fill="#7FA0B8"/></svg>