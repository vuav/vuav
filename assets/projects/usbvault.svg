<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" role="img" aria-label="Featured project: USBVAULT, alpha, Python. Per-file authenticated encryption for USB drives using Argon2id, HKDF-SHA256, ChaCha20-Poly1305 and 256 KB chunks. Key hierarchy: password, Argon2id, KEK, unwraps DEK, HKDF-SHA256, per-file keys. Every file is its own encrypted blob, so a changed file only rewrites that blob and corruption points at an exact file. Recovery is a printable one-time sheet with optional 3-of-5 Shamir shares; no backdoor, no password reset, no lockout. Also includes counterfeit-capacity detection, drive fingerprint binding, wear tracking, safe eject, GUI and CLI, tray agent, portable unlocker, Windows and Linux support, no account and no telemetry. USBVAULT is alpha and has not had an independent security audit; for data you cannot afford to lose, use a mature, audited tool."><title>Featured project: USBVAULT, alpha, Python. Per-file authenticated encryption for USB drives using Argon2id, HKDF-SHA256, ChaCha20-Poly1305 and 256 KB chunks. Key hierarchy: password, Argon2id, KEK, unwraps DEK, HKDF-SHA256, per-file keys. Every file is its own encrypted blob, so a changed file only rewrites that blob and corruption points at an exact file. Recovery is a printable one-time sheet with optional 3-of-5 Shamir shares; no backdoor, no password reset, no lockout. Also includes counterfeit-capacity detection, drive fingerprint binding, wear tracking, safe eject, GUI and CLI, tray agent, portable unlocker, Windows and Linux support, no account and no telemetry. USBVAULT is alpha and has not had an independent security audit; for data you cannot afford to lose, use a mature, audited tool.</title><rect x="0" y="0" width="900" height="750" rx="0" fill="#0A0B0D"/><text x="44" y="36" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="500" fill="#7FA0B8" text-anchor="start" letter-spacing="3.2">06 — FEATURED PROJECTS</text><text x="44" y="76" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="31" font-weight="700" fill="#E9EBED" text-anchor="start" letter-spacing="-0.4">Things I actually finished (mostly)</text><text x="856" y="76" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="500" fill="#565D66" text-anchor="end" letter-spacing="2.4">01 / 05</text><line x1="44" y1="96" x2="856" y2="96" stroke="#23272E" stroke-width="1" stroke-linecap="butt"/><line x1="44" y1="96" x2="100" y2="96" stroke="#7FA0B8" stroke-width="1.6" stroke-linecap="butt"/><rect x="44" y="132" width="812" height="588" rx="4" fill="#101216" stroke="#23272E" stroke-width="1"/><line x1="44" y1="132" x2="56" y2="132" stroke="#3C4E5C" stroke-width="1.2" stroke-linecap="butt"/><line x1="44" y1="132" x2="44" y2="144" stroke="#3C4E5C" stroke-width="1.2" stroke-linecap="butt"/><line x1="856" y1="132" x2="844" y2="132" stroke="#3C4E5C" stroke-width="1.2" stroke-linecap="butt"/><line x1="856" y1="132" x2="856" y2="144" stroke="#3C4E5C" stroke-width="1.2" stroke-linecap="butt"/><line x1="44" y1="720" x2="56" y2="720" stroke="#3C4E5C" stroke-width="1.2" stroke-linecap="butt"/><line x1="44" y1="720" x2="44" y2="708" stroke="#3C4E5C" stroke-width="1.2" stroke-linecap="butt"/><line x1="856" y1="720" x2="844" y2="720" stroke="#3C4E5C" stroke-width="1.2" stroke-linecap="butt"/><line x1="856" y1="720" x2="856" y2="708" stroke="#3C4E5C" stroke-width="1.2" stroke-linecap="butt"/><text x="72" y="184" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" fill="#E9EBED" text-anchor="start" letter-spacing="-0.3">USBVAULT</text><rect x="272" y="164" width="70.8" height="21" rx="3" fill="none" stroke="#2E343C" stroke-width="1"/><circle cx="284" cy="174.5" r="2.6" fill="#7FA0B8"/><text x="294" y="178.5" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#7FA0B8" text-anchor="start" letter-spacing="1.4">ALPHA</text><text x="828" y="172" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#565D66" text-anchor="end" letter-spacing="2.2">PYTHON · FLAGSHIP</text><line x1="72" y1="204" x2="828" y2="204" stroke="#23272E" stroke-width="1" stroke-linecap="butt"/><text x="72" y="238" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#E9EBED" text-anchor="start">Per-file authenticated encryption for USB drives.</text><text x="72" y="264" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="500" fill="#7FA0B8" text-anchor="start" letter-spacing="1.2">Argon2id · HKDF-SHA256 · ChaCha20-Poly1305 · 256 KB chunks</text><text x="72" y="300" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#8A929B" text-anchor="start">An open-source, privacy-focused USB encryption system.</text><text x="72" y="323.49" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#8A929B" text-anchor="start">Every file becomes its own encrypted blob instead of one</text><text x="72" y="346.98" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#8A929B" text-anchor="start">monolithic container, so a changed file only rewrites</text><text x="72" y="370.47" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#8A929B" text-anchor="start">its own blob and corruption points at an exact file.</text><text x="72" y="412" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#8A929B" text-anchor="start">Recovery is a printable one-time sheet, optionally split</text><text x="72" y="435.49" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#8A929B" text-anchor="start">into Shamir shares (3-of-5). No backdoor, no reset, no</text><text x="72" y="458.98" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#8A929B" text-anchor="start">hidden path. A wrong password tries the key slots and</text><text x="72" y="482.47" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#8A929B" text-anchor="start">fails cleanly — resistance comes from Argon2id being</text><text x="72" y="505.96000000000004" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#8A929B" text-anchor="start">expensive, not from a lockout.</text><text x="72" y="540" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#565D66" text-anchor="start" letter-spacing="2.4">ALSO IN THE BOX</text><rect x="72" y="554" width="230.4" height="22" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><text x="80" y="569.0" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">COUNTERFEIT-CAPACITY DETECTION</text><rect x="309.4" y="554" width="194.7" height="22" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><text x="317.4" y="569.0" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">DRIVE FINGERPRINT BINDING</text><rect x="72" y="582" width="108.9" height="22" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><text x="80" y="597.0" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">WEAR TRACKING</text><rect x="187.9" y="582" width="87.5" height="22" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><text x="195.9" y="597.0" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">SAFE EJECT</text><rect x="282.4" y="582" width="80.3" height="22" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><text x="290.4" y="597.0" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">GUI + CLI</text><rect x="369.7" y="582" width="87.5" height="22" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><text x="377.7" y="597.0" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">TRAY AGENT</text><rect x="72" y="610" width="137.5" height="22" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><text x="80" y="625.0" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">PORTABLE UNLOCKER</text><rect x="216.5" y="610" width="123.2" height="22" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><text x="224.5" y="625.0" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">WINDOWS + LINUX</text><rect x="72" y="638" width="187.5" height="22" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><text x="80" y="653.0" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">NO ACCOUNT, NO TELEMETRY</text><rect x="520" y="228" width="336" height="396" rx="3" fill="#0A0B0D" stroke="#23272E" stroke-width="1"/><text x="534" y="250" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10" font-weight="500" fill="#565D66" text-anchor="start" letter-spacing="1.8">FIG. 03 — KEY HIERARCHY</text><rect x="590.0" y="262" width="196" height="42" rx="3" fill="#15181D" stroke="#2E343C" stroke-width="1"/><line x1="590.0" y1="262" x2="590.0" y2="304" stroke="#7FA0B8" stroke-width="2" stroke-linecap="butt"/><text x="604.0" y="282" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#E9EBED" text-anchor="start" letter-spacing="1.8">PASSWORD</text><text x="604.0" y="296" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="400" fill="#565D66" text-anchor="start">user input</text><line x1="688.0" y1="308" x2="688.0" y2="334" stroke="#2E343C" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 3"/><path d="M684.0,330 L688.0,338 L692.0,330" fill="none" stroke="#7FA0B8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="666.0" y="328.0" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#7FA0B8" text-anchor="end" letter-spacing="1.2">Argon2id</text><rect x="590.0" y="344" width="196" height="42" rx="3" fill="#15181D" stroke="#2E343C" stroke-width="1"/><line x1="590.0" y1="344" x2="590.0" y2="386" stroke="#7FA0B8" stroke-width="2" stroke-linecap="butt"/><text x="604.0" y="364" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#E9EBED" text-anchor="start" letter-spacing="1.8">KEK</text><text x="604.0" y="378" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="400" fill="#565D66" text-anchor="start">key-encryption key</text><line x1="688.0" y1="390" x2="688.0" y2="416" stroke="#2E343C" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 3"/><path d="M684.0,412 L688.0,420 L692.0,412" fill="none" stroke="#7FA0B8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="666.0" y="410.0" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#7FA0B8" text-anchor="end" letter-spacing="1.2">unwraps</text><rect x="590.0" y="426" width="196" height="42" rx="3" fill="#15181D" stroke="#2E343C" stroke-width="1"/><line x1="590.0" y1="426" x2="590.0" y2="468" stroke="#7FA0B8" stroke-width="2" stroke-linecap="butt"/><text x="604.0" y="446" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#E9EBED" text-anchor="start" letter-spacing="1.8">DEK</text><text x="604.0" y="460" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="400" fill="#565D66" text-anchor="start">data-encryption key</text><line x1="688.0" y1="472" x2="688.0" y2="498" stroke="#2E343C" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 3"/><path d="M684.0,494 L688.0,502 L692.0,494" fill="none" stroke="#7FA0B8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="666.0" y="492.0" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#7FA0B8" text-anchor="end" letter-spacing="1.2">HKDF-SHA256</text><rect x="590.0" y="508" width="196" height="42" rx="3" fill="#15181D" stroke="#2E343C" stroke-width="1"/><line x1="590.0" y1="508" x2="590.0" y2="550" stroke="#7FA0B8" stroke-width="2" stroke-linecap="butt"/><text x="604.0" y="528" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#E9EBED" text-anchor="start" letter-spacing="1.8">PER-FILE KEY</text><text x="604.0" y="542" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="400" fill="#565D66" text-anchor="start">one per file</text><text x="590.0" y="576" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10" font-weight="400" fill="#565D66" text-anchor="start" letter-spacing="1.2">file → 256 KB chunks</text><rect x="590.0" y="586" width="26" height="12" rx="2" fill="none" stroke="#2E343C" stroke-width="1"/><rect x="593.0" y="589" width="20" height="6" rx="1" fill="#3C4E5C" opacity="0.7"/><rect x="623.0" y="586" width="26" height="12" rx="2" fill="none" stroke="#2E343C" stroke-width="1"/><rect x="626.0" y="589" width="20" height="6" rx="1" fill="#3C4E5C" opacity="0.7"/><rect x="656.0" y="586" width="26" height="12" rx="2" fill="none" stroke="#2E343C" stroke-width="1"/><rect x="659.0" y="589" width="20" height="6" rx="1" fill="#3C4E5C" opacity="0.7"/><rect x="689.0" y="586" width="26" height="12" rx="2" fill="none" stroke="#2E343C" stroke-width="1"/><rect x="692.0" y="589" width="20" height="6" rx="1" fill="#3C4E5C" opacity="0.7"/><rect x="722.0" y="586" width="26" height="12" rx="2" fill="none" stroke="#2E343C" stroke-width="1"/><rect x="725.0" y="589" width="20" height="6" rx="1" fill="#3C4E5C" opacity="0.7"/><rect x="755.0" y="586" width="26" height="12" rx="2" fill="none" stroke="#2E343C" stroke-width="1"/><rect x="758.0" y="589" width="20" height="6" rx="1" fill="#3C4E5C" opacity="0.7"/><text x="794.0" y="596" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.2">AEAD</text><rect x="72" y="638" width="756" height="68.75" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><line x1="72" y1="638" x2="72" y2="706.75" stroke="#3C4E5C" stroke-width="2" stroke-linecap="butt"/><text x="88" y="666.5" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#8A929B" text-anchor="start">USBVAULT is alpha software and has not had an independent security audit. For data you cannot</text><text x="88" y="686.75" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#8A929B" text-anchor="start">afford to lose, use a mature, audited tool.</text></svg>