<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 254" width="900" height="254" role="img" aria-label="Project: Raspberry Pi WireGuard VPN, active. A self-managed WireGuard VPN server running on a Raspberry Pi, with Linux administration and Wireshark for traffic analysis. Infrastructure I maintain rather than a protocol I wrote."><title>Project: Raspberry Pi WireGuard VPN, active. A self-managed WireGuard VPN server running on a Raspberry Pi, with Linux administration and Wireshark for traffic analysis. Infrastructure I maintain rather than a protocol I wrote.</title><rect x="0" y="0" width="900" height="254" rx="0" fill="#0A0B0D"/><rect x="44" y="24" width="812" height="206" rx="4" fill="#101216" stroke="#23272E" stroke-width="1"/><line x1="44" y1="24" x2="100" y2="24" stroke="#7FA0B8" stroke-width="2" stroke-linecap="butt"/><text x="70" y="68" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="#E9EBED" text-anchor="start" letter-spacing="-0.2">Pi WireGuard VPN</text><rect x="310.56255999999996" y="50" width="78.5" height="21" rx="3" fill="none" stroke="#2E343C" stroke-width="1"/><circle cx="322.56255999999996" cy="60.5" r="2.6" fill="#7FB894"/><text x="332.56255999999996" y="64.5" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#7FB894" text-anchor="start" letter-spacing="1.4">ACTIVE</text><text x="830" y="56" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#565D66" text-anchor="end" letter-spacing="2.2">04 / 05</text><text x="70" y="98" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#8A929B" text-anchor="start">A VPN I run, on hardware I own.</text><text x="70" y="124" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11" font-weight="500" fill="#7FA0B8" text-anchor="start" letter-spacing="1.1">Raspberry Pi · WireGuard · Linux · Wireshark</text><text x="70" y="152" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#565D66" text-anchor="start">Self-managed WireGuard server on a Raspberry Pi: my own tunnel, my own firewall</text><text x="70" y="172.8" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#565D66" text-anchor="start">rules and my own logs, of which there are none. Wireshark when traffic looks wrong.</text><text x="70" y="193.60000000000002" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#565D66" text-anchor="start">Not a protocol I wrote — infrastructure I actually maintain.</text><line x1="666" y1="44" x2="666" y2="210" stroke="#23272E" stroke-width="1" stroke-linecap="butt" opacity="0.7"/><circle cx="694" cy="127.0" r="5" fill="none" stroke="#7FA0B8" stroke-width="1.3"/><circle cx="810" cy="127.0" r="5" fill="none" stroke="#7FA0B8" stroke-width="1.3"/><path d="M702,113.0 Q752,91.0 802,113.0" fill="none" stroke="#2E343C" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter"/><path d="M702,141.0 Q752,163.0 802,141.0" fill="none" stroke="#2E343C" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter"/><line x1="702" y1="127.0" x2="802" y2="127.0" stroke="#3C4E5C" stroke-width="1" stroke-linecap="butt" stroke-dasharray="4 4"/><circle cx="718" cy="127.0" r="1.8" fill="#7FA0B8" opacity="0.8"/><circle cx="740" cy="127.0" r="1.8" fill="#7FA0B8" opacity="0.8"/><circle cx="762" cy="127.0" r="1.8" fill="#7FA0B8" opacity="0.8"/><circle cx="784" cy="127.0" r="1.8" fill="#7FA0B8" opacity="0.8"/></svg>