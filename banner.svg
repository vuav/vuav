<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="vuav — cybersecurity and encryption tooling">
  <title>vuav</title>

  <defs>
    <!-- vignette -->
    <radialGradient id="vig" cx="50%" cy="42%" r="75%">
      <stop offset="0%"  stop-color="#0d0d10"/>
      <stop offset="70%" stop-color="#070708"/>
      <stop offset="100%" stop-color="#040405"/>
    </radialGradient>

    <!-- scanline pattern -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" y="0" fill="#ffffff" opacity="0.04"/>
    </pattern>

    <!-- film grain -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>

    <!-- soft red glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- reveal mask: a bar sweeps left->right exposing the sigil -->
    <clipPath id="reveal">
      <rect x="300" y="80" width="0" height="180">
        <animate attributeName="width" values="0;0;620;620;620" keyTimes="0;0.12;0.5;0.92;1"
                 dur="9s" repeatCount="indefinite" calcMode="spline"
                 keySplines="0 0 1 1;.2 .7 .2 1;0 0 1 1;0 0 1 1"/>
      </rect>
    </clipPath>

    <!-- the VUAV sigil, drawn as geometric polygons (font-independent) -->
    <g id="sigil" fill="#d7d7de">
      <!-- V -->
      <polygon points="340,110 360,110 390,178 420,110 440,110 390,210"/>
      <!-- U -->
      <polygon points="470,110 490,110 490,190 550,190 550,110 570,110 570,210 470,210"/>
      <!-- A -->
      <polygon points="650,110 672,110 612,210 590,210"/>
      <polygon points="650,110 628,110 688,210 710,210"/>
      <rect x="615" y="168" width="70" height="18"/>
      <!-- V -->
      <polygon points="740,110 760,110 790,178 820,110 840,110 790,210"/>
    </g>

    <style><![CDATA[
      @keyframes settle { 0%{opacity:0;filter:blur(6px)} 14%{opacity:0;filter:blur(6px)}
        40%{opacity:1;filter:blur(0)} 100%{opacity:1;filter:blur(0)} }
      @keyframes jitter { 0%,7%,9%,54%,56%,100%{transform:translate(0,0)}
        8%{transform:translate(-3px,1px)} 55%{transform:translate(3px,-1px)} }
      @keyframes flick { 0%,96%,100%{opacity:.9} 97%{opacity:.35} 98%{opacity:1} }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes drift { from{transform:translateY(0)} to{transform:translateY(4px)} }
      @keyframes bar   { 0%{transform:translateX(-40px);opacity:0} 12%{opacity:1}
        50%{transform:translateX(560px);opacity:1} 62%{opacity:0} 100%{opacity:0} }
      @keyframes type  { from{width:0} to{width:560px} }
      .sig     { animation: settle 9s ease-in-out infinite, flick 9s steps(1) infinite; }
      .ghostR  { animation: jitter 9s steps(1) infinite; mix-blend-mode: screen; }
      .ghostC  { animation: jitter 9s steps(1) infinite reverse; mix-blend-mode: screen; }
      .scanmv  { animation: drift .9s steps(2) infinite alternate; }
      .redbar  { animation: bar 9s ease-in-out infinite; }
      .cursor  { animation: blink 1.1s steps(1) infinite; }
      .dot     { animation: blink 1.6s steps(1) infinite; }
      @media (prefers-reduced-motion: reduce){
        .sig,.ghostR,.ghostC,.scanmv,.redbar,.cursor,.dot{animation:none}
        .sig{opacity:1;filter:none}
      }
    ]]></style>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="320" fill="url(#vig)"/>
  <rect width="1200" height="320" fill="url(#vig)" filter="url(#grain)" opacity="0.6"/>

  <!-- faint rune column texture -->
  <g fill="#8c1f28" opacity="0.06" font-family="monospace" font-size="26" letter-spacing="10">
    <text x="60" y="60">ᚨ ᚱ ᚦ ᚹ ᛟ ᚷ ᛁ ᛊ ᛞ ᚾ ᛒ ᛖ ᚲ ᛏ ᛚ ᛗ ᚦ ᛟ ᚹ ᚨ</text>
    <text x="60" y="290">ᛖ ᚲ ᛏ ᛚ ᛗ ᚨ ᚱ ᚦ ᚹ ᛟ ᚷ ᛁ ᛊ ᛞ ᚾ ᛒ ᛟ ᚹ ᚨ ᚱ</text>
  </g>

  <!-- terminal HUD corners -->
  <g stroke="#8c1f28" stroke-width="2" fill="none" opacity="0.85">
    <path d="M24 44 v-20 h20"/>
    <path d="M1176 44 v-20 h-20"/>
    <path d="M24 276 v20 h20"/>
    <path d="M1176 276 v20 h-20"/>
  </g>

  <!-- HUD text -->
  <text x="46" y="40" fill="#5a5a66" font-family="monospace" font-size="13" letter-spacing="1">vuav@sys:~$ ./identity --render</text>
  <g font-family="monospace" font-size="13" letter-spacing="1">
    <circle class="dot" cx="1058" cy="35" r="4" fill="#8c1f28"/>
    <text x="1072" y="40" fill="#8c9a8c">SECURE</text>
  </g>

  <!-- the sigil stack: cyan + red ghosts, then bone master, all revealed by the sweep -->
  <g clip-path="url(#reveal)">
    <use href="#sigil" class="sig ghostC" transform="translate(-4,0)" fill="#2fb6b6" opacity="0.55"/>
    <use href="#sigil" class="sig ghostR" transform="translate(4,0)"  fill="#8c1f28" opacity="0.7"/>
    <use href="#sigil" class="sig" filter="url(#glow)"/>
  </g>

  <!-- red scan bar riding the reveal -->
  <rect class="redbar" x="300" y="82" width="5" height="176" fill="#c62c38" opacity="0.9"/>

  <!-- underline -->
  <rect x="340" y="226" width="500" height="3" fill="#8c1f28" opacity="0.8"/>

  <!-- subtitle -->
  <text x="340" y="262" font-family="monospace" font-size="16" letter-spacing="2">
    <tspan fill="#c9c9d1">cybersecurity</tspan><tspan fill="#5a5a66">  ·  </tspan><tspan fill="#c9c9d1">encryption tooling</tspan><tspan fill="#5a5a66">  ·  </tspan><tspan fill="#8c1f28">c++ // python</tspan><tspan class="cursor" fill="#8c1f28"> █</tspan>
  </text>

  <!-- scanline + subtle motion overlay -->
  <rect class="scanmv" width="1200" height="330" y="-6" fill="url(#scan)"/>
</svg>
