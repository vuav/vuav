<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 348" width="900" height="348" role="img" aria-label="vuav lab: experiments, not finished projects. Local AI agents, work in progress: small agents that handle repetitive jobs. LLM security harness, idea: a repeatable way to test prompt injection and jailbreak behaviour. Pi security lab, work in progress: an isolated network for traffic capture and malware analysis. Reverse-engineering notes, research: pulling apart binaries and firmware."><title>vuav lab: experiments, not finished projects. Local AI agents, work in progress: small agents that handle repetitive jobs. LLM security harness, idea: a repeatable way to test prompt injection and jailbreak behaviour. Pi security lab, work in progress: an isolated network for traffic capture and malware analysis. Reverse-engineering notes, research: pulling apart binaries and firmware.</title><rect x="0" y="0" width="900" height="348" rx="0" fill="#0A0B0D"/><text x="44" y="36" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="500" fill="#7FA0B8" text-anchor="start" letter-spacing="3.2">07 — VUAV LAB</text><text x="44" y="76" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="31" font-weight="700" fill="#E9EBED" text-anchor="start" letter-spacing="-0.4">Not projects yet</text><text x="856" y="76" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="500" fill="#565D66" text-anchor="end" letter-spacing="2.4">open bench</text><line x1="44" y1="96" x2="856" y2="96" stroke="#23272E" stroke-width="1" stroke-linecap="butt"/><line x1="44" y1="96" x2="100" y2="96" stroke="#7FA0B8" stroke-width="1.6" stroke-linecap="butt"/><text x="44" y="132" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#8A929B" text-anchor="start">Half-built, half-thought-through. If it's on this list it is an experiment, not software you should rely on.</text><line x1="44" y1="154" x2="856" y2="154" stroke="#23272E" stroke-width="1" stroke-linecap="butt" opacity="0.8"/><text x="44" y="176" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13.5" font-weight="500" fill="#E9EBED" text-anchor="start">Local AI agents</text><text x="268" y="176" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.6" font-weight="400" fill="#565D66" text-anchor="start">Small agents that do my repetitive jobs without me watching them.</text><rect x="800.7" y="160" width="55.3" height="21" rx="3" fill="none" stroke="#2E343C" stroke-width="1"/><circle cx="812.7" cy="170.5" r="2.6" fill="#B8A06E"/><text x="822.7" y="174.5" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#B8A06E" text-anchor="start" letter-spacing="1.4">WIP</text><line x1="44" y1="194" x2="856" y2="194" stroke="#23272E" stroke-width="1" stroke-linecap="butt" opacity="0.8"/><text x="44" y="216" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13.5" font-weight="500" fill="#E9EBED" text-anchor="start">LLM security harness</text><text x="268" y="216" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.6" font-weight="400" fill="#565D66" text-anchor="start">A repeatable way to test prompt injection and jailbreak behaviour.</text><rect x="793.0" y="200" width="63.0" height="21" rx="3" fill="none" stroke="#2E343C" stroke-width="1"/><circle cx="805.0" cy="210.5" r="2.6" fill="#565D66"/><text x="815.0" y="214.5" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#565D66" text-anchor="start" letter-spacing="1.4">IDEA</text><line x1="44" y1="234" x2="856" y2="234" stroke="#23272E" stroke-width="1" stroke-linecap="butt" opacity="0.8"/><text x="44" y="256" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13.5" font-weight="500" fill="#E9EBED" text-anchor="start">Pi security lab</text><text x="268" y="256" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.6" font-weight="400" fill="#565D66" text-anchor="start">Isolated network for traffic capture and malware analysis.</text><rect x="800.7" y="240" width="55.3" height="21" rx="3" fill="none" stroke="#2E343C" stroke-width="1"/><circle cx="812.7" cy="250.5" r="2.6" fill="#B8A06E"/><text x="822.7" y="254.5" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#B8A06E" text-anchor="start" letter-spacing="1.4">WIP</text><line x1="44" y1="274" x2="856" y2="274" stroke="#23272E" stroke-width="1" stroke-linecap="butt" opacity="0.8"/><text x="44" y="296" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13.5" font-weight="500" fill="#E9EBED" text-anchor="start">Reverse-engineering notes</text><text x="268" y="296" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.6" font-weight="400" fill="#565D66" text-anchor="start">Pulling apart binaries and firmware to understand the format.</text><rect x="762.0" y="280" width="94.0" height="21" rx="3" fill="none" stroke="#2E343C" stroke-width="1"/><circle cx="774.0" cy="290.5" r="2.6" fill="#8A929B"/><text x="784.0" y="294.5" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">RESEARCH</text><line x1="44" y1="314" x2="856" y2="314" stroke="#23272E" stroke-width="1" stroke-linecap="butt"/></svg>