<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Security research. Offensive: penetration testing, vulnerability research, exploitation research, web and network security. Analysis: reverse engineering, malware research, OSINT, traffic analysis. Defensive: OPSEC and privacy architecture, Linux and system hardening, security automation, device and game security. Toolkit: Nmap, Wireshark, Metasploit, Hashcat, Hydra, John the Ripper, Aircrack-ng. Scope: everything happens in VMs, lab networks and hardware I own; controlled proof-of-concept work stays in isolated environments; no production systems and no one else's data."><title>Security research. Offensive: penetration testing, vulnerability research, exploitation research, web and network security. Analysis: reverse engineering, malware research, OSINT, traffic analysis. Defensive: OPSEC and privacy architecture, Linux and system hardening, security automation, device and game security. Toolkit: Nmap, Wireshark, Metasploit, Hashcat, Hydra, John the Ripper, Aircrack-ng. Scope: everything happens in VMs, lab networks and hardware I own; controlled proof-of-concept work stays in isolated environments; no production systems and no one else's data.</title><rect x="0" y="0" width="900" height="470" rx="0" fill="#0A0B0D"/><text x="44" y="36" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="500" fill="#7FA0B8" text-anchor="start" letter-spacing="3.2">05 — SECURITY RESEARCH</text><text x="44" y="76" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="31" font-weight="700" fill="#E9EBED" text-anchor="start" letter-spacing="-0.4">Attack it, then defend it</text><text x="856" y="76" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="500" fill="#565D66" text-anchor="end" letter-spacing="2.4">isolated labs only</t