00" fill="#8A929B" text-anchor="start">Reverse engineering</text><text x="318" y="214" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">Malware research</text><text x="318" y="240" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">OSINT</text><text x="318" y="266" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">Traffic analysis</text><line x1="592" y1="132" x2="832" y2="132" stroke="#2E343C" stroke-width="1" stroke-linecap="butt"/><line x1="592" y1="132" x2="626" y2="132" stroke="#7FA0B8" stroke-width="1.8" stroke-linecap="butt"/><text x="592" y="158" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#E9EBED" text-anchor="start" letter-spacing="2.6">DEFENSIVE</text><text x="592" y="188" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">OPSEC &amp; privacy architecture</text><text x="592" y="214" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">Linux &amp; system hardening</text><text x="592" y="240" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">Security automation</text><text x="592" y="266" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">Device &amp; game security</text><text x="44" y="322" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#565D66" text-anchor="start" letter-spacing="2.6">TOOLKIT</text><rect x="44" y="334" width="51.0" height="24" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><text x="54" y="350.0" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">NMAP</text><rect x="102.0" y="334" width="89.8" height="24" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><text x="112.0" y="350.0" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">WIRESHARK</text><rect x="198.8" y="334" width="97.5" height="24" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><text x="208.8" y="350.0" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">METASPLOIT</text><rect x="303.3" y="334" width="74.3" height="24" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><text x="313.3" y="350.0" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">HASHCAT</text><rect x="384.6" y="334" width="58.8" height="24" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><text x="394.6" y="350.0" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">HYDRA</text><rect x="450.40000000000003" y="334" width="136.3" height="24" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><text x="460.40000000000003" y="350.0" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">JOHN THE RIPPER</text><rect x="593.7" y="334" width="105.3" height="24" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><text x="603.7" y="350.0" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="500" fill="#8A929B" text-anchor="start" letter-spacing="1.4">AIRCRACK-NG</text><rect x="44" y="384" width="812" height="89.0" rx="3" fill="#15181D" stroke="#23272E" stroke-width="1"/><line x1="44" y1="384" x2="44" y2="473.0" stroke="#3C4E5C" stroke-width="2" stroke-linecap="butt"/><text x="60" y="412.5" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#8A929B" text-anchor="start">scope: all of this happens in VMs, lab networks and hardware I own. Controlled proof-of-concept work —</text><text x="60" y="432.75" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#8A929B" text-anchor="start">RAT and worm concepts — stays in isolated environments. The point is understanding attacker behaviour</text><text x="60" y="453.0" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="400" fill="#8A929B" text-anchor="start">well enough to defend against it. No production systems, no one else's data.</text></svg>