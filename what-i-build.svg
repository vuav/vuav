<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="What I build. Security: research, automation and defensive tooling. AI: LLM experiments, agents and the plumbing around them. Software: small tools that remove repetitive work. Web: full-stack applications and interfaces. Systems: Linux, networking, self-hosting and infrastructure. Hardware: Raspberry Pi and Arduino projects."><title>What I build. Security: research, automation and defensive tooling. AI: LLM experiments, agents and the plumbing around them. Software: small tools that remove repetitive work. Web: full-stack applications and interfaces. Systems: Linux, networking, self-hosting and infrastructure. Hardware: Raspberry Pi and Arduino projects.</title><rect x="0" y="0" width="900" height="470" rx="0" fill="#0A0B0D"/><text x="44" y="36" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="500" fill="#7FA0B8" text-anchor="start" letter-spacing="3.2">03 — WHAT I BUILD</text><text x="44" y="76" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="31" font-weight="700" fill="#E9EBED" text-anchor="start" letter-spacing="-0.4">Six directions, one habit</text><text x="856" y="76" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="500" fill="#565D66" text-anchor="end" letter-spacing="2.4">core habit</text><line x1="44" y1="96" x2="856" y2="96" stroke="#23272E" stroke-width="1" stroke-linecap="butt"/><line x1="44" y1="96" x2="100" y2="96" stroke="#7FA0B8" stroke-width="1.6" stroke-linecap="butt"/><text x="44" y="130" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#8A929B" text-anchor="start">“I can't be asked to do it myself, so I'll build something that does it for me.”</text><rect x="44" y="176" width="264" height="128" rx="4" fill="#101216" stroke="#23272E" stroke-width="1"/><line x1="44" y1="176" x2="84" y2="176" stroke="#7FA0B8" stroke-width="1.8" stroke-linecap="butt"/><text x="62" y="210" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#E9EBED" text-anchor="start" letter-spacing="2.6">SECURITY</text><text x="62" y="236" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">Research, automation and defensive</text><text x="62" y="255.53" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">tooling. Attack it, then work out</text><text x="62" y="275.06" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">how you'd have stopped it.</text><rect x="328" y="176" width="264" height="128" rx="4" fill="#101216" stroke="#23272E" stroke-width="1"/><line x1="328" y1="176" x2="368" y2="176" stroke="#7FA0B8" stroke-width="1.8" stroke-linecap="butt"/><text x="346" y="210" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#E9EBED" text-anchor="start" letter-spacing="2.6">AI</text><text x="346" y="236" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">LLM experiments, agents and the</text><text x="346" y="255.53" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">plumbing around them — context,</text><text x="346" y="275.06" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">structure, failure modes.</text><rect x="612" y="176" width="264" height="128" rx="4" fill="#101216" stroke="#23272E" stroke-width="1"/><line x1="612" y1="176" x2="652" y2="176" stroke="#7FA0B8" stroke-width="1.8" stroke-linecap="butt"/><text x="630" y="210" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#E9EBED" text-anchor="start" letter-spacing="2.6">SOFTWARE</text><text x="630" y="236" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">Small tools that delete repetitive</text><text x="630" y="255.53" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">work from my week.</text><rect x="44" y="324" width="264" height="128" rx="4" fill="#101216" stroke="#23272E" stroke-width="1"/><line x1="44" y1="324" x2="84" y2="324" stroke="#7FA0B8" stroke-width="1.8" stroke-linecap="butt"/><text x="62" y="358" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#E9EBED" text-anchor="start" letter-spacing="2.6">WEB</text><text x="62" y="384" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">Full‑stack applications and</text><text x="62" y="403.53" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">interfaces, front to back.</text><rect x="328" y="324" width="264" height="128" rx="4" fill="#101216" stroke="#23272E" stroke-width="1"/><line x1="328" y1="324" x2="368" y2="324" stroke="#7FA0B8" stroke-width="1.8" stroke-linecap="butt"/><text x="346" y="358" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#E9EBED" text-anchor="start" letter-spacing="2.6">SYSTEMS</text><text x="346" y="384" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">Linux, networking, self‑hosting and</text><text x="346" y="403.53" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">infrastructure I actually maintain.</text><rect x="612" y="324" width="264" height="128" rx="4" fill="#101216" stroke="#23272E" stroke-width="1"/><line x1="612" y1="324" x2="652" y2="324" stroke="#7FA0B8" stroke-width="1.8" stroke-linecap="butt"/><text x="630" y="358" font-family="ui-monospace,'SFMono-Regular','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#E9EBED" text-anchor="start" letter-spacing="2.6">HARDWARE</text><text x="630" y="384" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">Raspberry Pi, Arduino and things</text><text x="630" y="403.53" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">that only exist because they'd be</text><text x="630" y="423.05999999999995" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.6" font-weight="400" fill="#8A929B" text-anchor="start">funny.</text></svg>